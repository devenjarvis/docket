<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docket</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<script>
// Set the theme before first paint so the window never flashes the wrong one.
(function () {
  var t = localStorage.getItem("docket-theme") || "auto";
  if (t === "auto") t = matchMedia("(prefers-color-scheme: dark)").matches ? "blueprint" : "whiteprint";
  document.documentElement.dataset.theme = t;
})();
</script>
<link rel="stylesheet" href="/static/docket.css">
</head>
<body>
<div id="app" class="page"></div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script type="module" src="/static/app.js"></script>
</body>
</html>
