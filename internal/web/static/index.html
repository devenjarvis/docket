<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docket</title>
<script>
// Set the mode and the colourway before first paint so the window never flashes the wrong one.
(function () {
  var r = document.documentElement, inks = ["black-tomato", "federal-pink", "hunter-orange", "plum-sunflower", "teal-yellow", "blue-orange"];
  var dark = matchMedia("(prefers-color-scheme: dark)");
  function apply() {
    var t = "auto", i = "";
    try { t = localStorage.getItem("docket-theme") || "auto"; i = localStorage.getItem("docket-ink") || ""; } catch (e) { /* no storage */ }
    if (t === "whiteprint") t = "light";
    if (t === "blueprint") t = "dark";
    if (t !== "light" && t !== "dark") t = dark.matches ? "dark" : "light";
    r.dataset.theme = t;
    r.dataset.ink = inks.indexOf(i) >= 0 ? i : inks[0];
  }
  apply();
  dark.addEventListener("change", apply);
  window.docketApplyTheme = apply;
})();
</script>
<link rel="stylesheet" href="/static/docket.css">
</head>
<body>
<div id="app" class="page"></div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script type="module" src="/static/app.js"></script>
</body>
</html>
