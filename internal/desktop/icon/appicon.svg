<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Docket's app icon, in the Whiteprint design system (docs/design-system.md).
       A sheet from a drawing set on the blueprint table: ink linework for what
       is in the pull request; a red revision cloud and a filled revision
       triangle for the reviewer's decision, answered. Rendered to PNG by
       "make icon". -->
  <defs>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <pattern id="grid" width="51.5" height="51.5" patternUnits="userSpaceOnUse" x="100" y="100">
      <path d="M51.5 0H0V51.5" fill="none" stroke="#1B3A66" stroke-width="3"/>
    </pattern>
  </defs>
  <!-- the table: Blueprint film and its grid -->
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="#0F2747"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#grid)"/>
  </g>
  <!-- the sheet behind it -->
  <rect x="284" y="196" width="500" height="600" fill="#93A8C9"/>
  <!-- the sheet: border line and title block in ink -->
  <rect x="240" y="236" width="500" height="600" fill="#F6F7F3"/>
  <rect x="272" y="268" width="436" height="536" fill="none" stroke="#1B2163" stroke-width="16"/>
  <path d="M272 712H708M528 712V804" fill="none" stroke="#1B2163" stroke-width="12"/>
  <!-- linework: the pull request -->
  <g stroke="#1B2163" stroke-width="28">
    <path d="M324 336H612"/>
    <path d="M368 428H528"/>
    <path d="M368 484H552"/>
    <path d="M324 584H600"/>
    <path d="M324 640H500"/>
  </g>
  <!-- the reviewer's mark: a revision cloud and its triangle, filled once answered -->
  <path d="M332.0 392.0 A32.6 32.6 0 0 1 394.0 392.0 A32.6 32.6 0 0 1 456.0 392.0 A32.6 32.6 0 0 1 518.0 392.0 A32.6 32.6 0 0 1 580.0 392.0 A33.6 33.6 0 0 1 580.0 456.0 A33.6 33.6 0 0 1 580.0 520.0 A32.6 32.6 0 0 1 518.0 520.0 A32.6 32.6 0 0 1 456.0 520.0 A32.6 32.6 0 0 1 394.0 520.0 A32.6 32.6 0 0 1 332.0 520.0 A33.6 33.6 0 0 1 332.0 456.0 A33.6 33.6 0 0 1 332.0 392.0 Z" fill="none" stroke="#BF2A1A" stroke-width="18" stroke-linejoin="round"/>
  <path d="M708 300L790 448H626Z" fill="#BF2A1A" stroke="#F6F7F3" stroke-width="16" stroke-linejoin="miter" paint-order="stroke"/>
</svg>
